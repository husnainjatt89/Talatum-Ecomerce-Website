{% extends 'base.html' %}
{% block title %}500 – Server Error{% endblock %}
{% block content %}
<div class="error-page text-center py-5">
  <div class="container">
    <h1 class="error-code text-gold">500</h1>
    <h3>Internal Server Error</h3>
    <p class="text-muted">Something went wrong on our end. Please try again later.</p>
    <a href="{{ url_for('user.home') }}" class="btn btn-gold btn-lg mt-3">Go Home</a>
  </div>
</div>
{% endblock %}
